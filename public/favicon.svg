<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#090d16" />
  <!-- Capsule 1 (Left) -->
  <rect x="18" y="14" width="12" height="36" rx="6" fill="url(#pillGrad)" opacity="0.85" />
  <rect x="18" y="14" width="12" height="36" rx="6" fill="none" stroke="url(#rimGrad)" stroke-width="1.5" />
  <!-- Capsule 2 (Right) -->
  <rect x="34" y="14" width="12" height="36" rx="6" fill="url(#pillGrad)" opacity="0.95" />
  <rect x="34" y="14" width="12" height="36" rx="6" fill="none" stroke="url(#rimGrad)" stroke-width="1.5" />
</svg>
